events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        location /api/users {
            proxy_pass http://user-service:3001/users;
        }

        location /api/products {
            proxy_pass http://product-service:3002/products;
        }

        location /api/orders {
            proxy_pass http://order-service:3003/orders;
        }
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }
    }
}